name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (lockfile-aware)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint --if-present

      - name: Unit test
        run: npm test --if-present -- --ci --reporters=default --watchAll=false

      - name: Build
        run: npm run build

      - name: Upload artifact (dist/.next/build)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            dist
            build
            .next
          if-no-files-found: ignore
